name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tabsy-app/package-lock.json

      - name: Install dependencies
        working-directory: tabsy-app
        run: npm ci

      - name: Run automated unit tests (Vitest)
        working-directory: tabsy-app
        run: npm test

      - name: Build Next.js application
        working-directory: tabsy-app
        run: npm run build
